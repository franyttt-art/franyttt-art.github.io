<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trilingua</title>
<script>
// Cualquier variante de la dirección (Trilingua, TRILINGUA…) lleva a la app.
var p = location.pathname;
if (/^\/(gymblack|forja)/i.test(p)) location.replace("/gymblack/" + p.replace(/^\/(gymblack|forja)\/?/i, "") + location.search + location.hash);
else if (/^\/trilingua/i.test(p)) location.replace("/trilingua/" + p.replace(/^\/trilingua\/?/i, "") + location.search + location.hash);
else location.replace("/trilingua/");
</script>

</head><body><p>Abriendo Trilingua… <a href="/trilingua/">tocá acá si no abre</a></p></body></html>
